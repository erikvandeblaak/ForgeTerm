[workspace]
resolver = "3"
members = ["crates/forgeterm-terminal", "crates/forgeterm-explorer", "crates/forgeterm-settings", "crates/forgeterm-agents", "crates/forgeterm-app"]
default-members = ["crates/forgeterm-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Erik van de Blaak"]
license = "LicenseRef-Proprietary"
repository = ""
rust-version = "1.88"

[workspace.dependencies]
forgeterm-terminal = { path = "crates/forgeterm-terminal" }
forgeterm-explorer = { path = "crates/forgeterm-explorer" }
forgeterm-settings = { path = "crates/forgeterm-settings" }
forgeterm-agents = { path = "crates/forgeterm-agents" }

alacritty_terminal = "0.26"
# x11 + wayland: winit's Linux backends (no effect on Windows). Without them the app
# does not build on Linux at all.
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "canvas", "svg", "tokio", "fira-sans", "x11", "wayland"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
